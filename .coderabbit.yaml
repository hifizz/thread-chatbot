# CodeRabbit configuration
# 对默认分支及所有非默认目标分支开启自动 review。

reviews:
  # 是否在 PR 中显示 review 状态消息
  review_status: true

  auto_review:
    # 全局开关：开启后 CodeRabbit 会自动 review PR，并在后续 push 时增量复查。
    enabled: true
    auto_incremental_review: true
    # CodeRabbit 默认只 review 以仓库默认分支为目标的 PR；该正则额外覆盖所有目标分支。
    base_branches:
      - ".*"

# 可选：自定义 review 配置（例如 profile），按需打开
#profile: CHILL
