name: Agent Evals Scheduled

on:
  schedule:
    - cron: "17 3 * * 3"
  workflow_dispatch:
    inputs:
      run_live:
        description: Run live model/Search/Langfuse suites
        required: false
        default: false
        type: boolean
      judge_model:
        description: Optional registered model ID for the five-dimension judge
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  AI_OBSERVABILITY_ENVIRONMENT: evaluation
  AI_DEVTOOLS_ENABLED: "false"
  AI_TELEMETRY_RECORD_CONTENT: "false"
  EVAL_CANDIDATE: scheduled-${{ github.run_id }}
  AI_OBSERVABILITY_RELEASE: ${{ github.sha }}
  GIT_COMMIT_SHA: ${{ github.sha }}
  EVAL_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  broad-fixture:
    runs-on: ubuntu-latest
    env:
      AI_TELEMETRY_ENABLED: "false"
      AI_LANGFUSE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Search, memory, multimodal, reliability and scorer report
        run: >-
          pnpm eval:agent:scheduled --
          --write-snapshot=evals/agent/results/local/scheduled.json
      - name: Compare fixture baseline
        run: >-
          pnpm eval:agent:compare --
          --baseline=evals/agent/baselines/fixture-scheduled-v1.json
          --candidate=evals/agent/results/local/scheduled.json
          --output=evals/agent/results/local/comparison.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduled-agent-eval-${{ github.run_id }}
          path: evals/agent/results/local/

  live-content:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live
    needs: broad-fixture
    runs-on: ubuntu-latest
    env:
      AI_TELEMETRY_ENABLED: "true"
      AI_LANGFUSE_ENABLED: "true"
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
      AI_OBSERVABILITY_ID_SALT: ${{ secrets.AI_OBSERVABILITY_ID_SALT }}
      EVAL_MODEL_ID: ${{ vars.EVAL_MODEL_ID }}
      UMAPIS_API_KEY_CLAUDE: ${{ secrets.UMAPIS_API_KEY_CLAUDE }}
      UMAPIS_API_KEY_GPT: ${{ secrets.UMAPIS_API_KEY_GPT }}
      ANYSEARCH_API_KEY: ${{ secrets.ANYSEARCH_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Live content experiment
        run: >-
          pnpm eval:agent:release -- --executor=declared
          --suite=core-answer,search-routing,memory-context,multimodal
          --judge-model=${{ inputs.judge_model }}
          --langfuse-experiment
          --experiment=thread-chat-scheduled-live
          --write-snapshot=evals/agent/results/local/live.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-agent-eval-${{ github.run_id }}
          path: evals/agent/results/local/
