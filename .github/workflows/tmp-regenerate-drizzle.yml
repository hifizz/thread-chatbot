name: tmp-regenerate-drizzle

on:
  push:
    branches:
      - fix/regenerate-db-migration-latest-main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://drizzle:drizzle@127.0.0.1:5432/drizzle
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/regenerate-db-migration-latest-main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "chore(db): regenerate migrations from latest main"
          git push origin HEAD:fix/regenerate-db-migration-latest-main
