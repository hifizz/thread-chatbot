name: Project Panel Store Bind Patch

on:
  push:
    branches:
      - codex/research-project-workspace-design
    paths:
      - .github/workflows/project-panel-store-bind-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/research-project-workspace-design

      - name: Patch ThreadChat shell
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/thread-chat/thread-chat-demo.tsx')
          text = path.read_text()
          text = text.replace(
              'import { ArtifactDrawer } from "./orchestration/artifacts/artifact-drawer"',
              'import { StoreBoundProjectPanel } from "./orchestration/artifacts/store-bound-project-panel"',
          )
          old = '''      <ArtifactDrawer
        state={tree}
        open={drawerOpen}
        activeId={activeArtifactId}
        onClose={closeDrawer}
        onSelect={setActiveArtifactId}
        onLocate={(threadId) => openBranchUI(threadId, null)}
      />'''
          new = '''      <StoreBoundProjectPanel
        projectId={treeId}
        store={runtime.store}
        client={runtime.client}
        commands={runtime.commands}
        open={drawerOpen}
        activeId={activeArtifactId}
        onClose={closeDrawer}
        onSelect={setActiveArtifactId}
        onLocate={(threadId) => openBranchUI(threadId, null)}
      />'''
          if old not in text:
              raise SystemExit('ArtifactDrawer integration block not found')
          text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/thread-chat/thread-chat-demo.tsx
          git commit -m "refactor(project): share project panel conversation store [skip ci]"
          git push origin HEAD:codex/research-project-workspace-design

# trigger: 2
