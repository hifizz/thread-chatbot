name: Snapshot Sharing

on:
  push:
    branches: [codex/propose-snapshot-sharing]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: snapshot_sharing_contract
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/snapshot_sharing_http
      BETTER_AUTH_SECRET: snapshot-sharing-ci-secret-at-least-32-characters
      MINIMAX_API_KEY: snapshot-sharing-build-placeholder
      OPENSPEC_TELEMETRY: "0"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:thread-chat:sharing
      - run: pnpm test:thread-chat:sharing-dialog
      - name: PostgreSQL contract and concurrency
        run: pnpm test:thread-chat:sharing-db
        env:
          SNAPSHOT_SHARING_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/snapshot_sharing_contract
      - name: Create empty HTTP test database
        run: psql postgres://postgres:postgres@localhost:5432/postgres -c 'CREATE DATABASE snapshot_sharing_http'
      - run: pnpm build
      - name: Production HTTP lifecycle and privacy
        run: pnpm test:thread-chat:sharing-http
        env:
          SNAPSHOT_SHARING_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/snapshot_sharing_http
      - run: pnpm exec openspec validate add-snapshot-sharing --strict
