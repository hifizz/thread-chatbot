name: Project Workspace CI

on:
  push:
    branches:
      - codex/research-project-workspace-design
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wire store-bound Project Panel
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/thread-chat/thread-chat-demo.tsx')
          text = path.read_text()
          text = text.replace(
              'import { ArtifactDrawer } from "./orchestration/artifacts/artifact-drawer"',
              'import { StoreBoundProjectPanel } from "./orchestration/artifacts/store-bound-project-panel"',
          )
          old = '''      <ArtifactDrawer
        state={tree}
        open={drawerOpen}
        activeId={activeArtifactId}
        onClose={closeDrawer}
        onSelect={setActiveArtifactId}
        onLocate={(threadId) => openBranchUI(threadId, null)}
      />'''
          new = '''      <StoreBoundProjectPanel
        projectId={treeId}
        store={runtime.store}
        client={runtime.client}
        commands={runtime.commands}
        open={drawerOpen}
        activeId={activeArtifactId}
        onClose={closeDrawer}
        onSelect={setActiveArtifactId}
        onLocate={(threadId) => openBranchUI(threadId, null)}
      />'''
          if old in text:
              text = text.replace(old, new)
              path.write_text(text)
          PY

      - name: Commit shell integration if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/thread-chat/thread-chat-demo.tsx
          git commit -m "refactor(project): share project panel conversation store [skip ci]"
          git push origin HEAD:codex/research-project-workspace-design

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate OpenSpec
        run: pnpm openspec:validate
