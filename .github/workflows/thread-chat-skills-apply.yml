name: Thread Chat Skills Apply Inspection

on:
  pull_request:
    paths:
      - "openspec/changes/add-thread-chat-skills/**"
      - ".github/workflows/thread-chat-skills-apply.yml"
      - "app/**"
      - "constants/**"
      - "lib/**"
      - "runtime-skills/**"
      - "scripts/**"
      - "e2e/**"
      - "evals/**"
      - "drizzle/**"
      - "package.json"
      - "pnpm-lock.yaml"

jobs:
  inspect-and-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: OpenSpec status
        run: pnpm exec openspec status --change add-thread-chat-skills --json
      - name: OpenSpec apply instructions
        run: pnpm exec openspec instructions apply --change add-thread-chat-skills --json
      - name: Skill package contracts
        run: |
          node --import tsx e2e/thread-chat/runtime-skill-foundation.test.mjs
          node --import tsx e2e/thread-chat/runtime-skill-package.test.mjs
          node --import tsx scripts/skills/validate.ts --path runtime-skills/research
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Existing smoke regressions
        run: |
          pnpm eval:agent
          pnpm test:thread-chat:gate2-pipeline
          pnpm test:thread-chat:gate3-client
