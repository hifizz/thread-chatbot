name: Apply verified Beta implementation

on:
  pull_request:
    paths:
      - ".beta-transfer/**"
      - ".github/workflows/beta-apply.yml"

permissions:
  contents: read

jobs:
  apply:
    if: >-
      github.event.pull_request.number == 163 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'spec/beta-01-internationalization'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      BRANCH: spec/beta-01-internationalization
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply integrity-checked source changes
        run: |
          python3 - <<'PY'
          import hashlib, json, lzma, pathlib, subprocess
          root = pathlib.Path.cwd().resolve()
          parts = sorted((root / '.beta-transfer').glob('*.xzpart'))
          if len(parts) != 11:
              raise SystemExit('Expected exactly 11 transfer parts')
          packed = b''.join(p.read_bytes() for p in parts)
          decoder = lzma.LZMADecompressor(memlimit=128 * 1024 * 1024)
          raw = decoder.decompress(packed, max_length=1024 * 1024)
          if not decoder.eof or decoder.unused_data:
              raise SystemExit('Invalid or oversized transfer payload')
          digest = hashlib.sha256(raw).hexdigest()
          if digest != 'e162209b284ee989344a00088fd60f1f5322f3d4ea7651c185f869099a31c0ef':
              raise SystemExit('Transfer digest mismatch')
          data = json.loads(raw)
          if data['version'] != 1 or data['branch'] != 'spec/beta-01-internationalization':
              raise SystemExit('Wrong transfer target')
          if data['base'] != '9dff4f46ad0368bd426a0940ad72388bb0655f3b':
              raise SystemExit('Wrong transfer base')
          subprocess.run(['git', 'merge-base', '--is-ancestor', data['base'], 'HEAD'], check=True)
          changes = subprocess.check_output(['git', 'diff', '--name-only', data['base'], 'HEAD'], text=True).splitlines()
          if any(not (p.startswith('.beta-transfer/') or p == '.github/workflows/beta-apply.yml') for p in changes):
              raise SystemExit('Branch changed after preparation; do not overwrite')
          pending = []
          for item in data['files']:
              p = pathlib.PurePosixPath(item['path'])
              if p.is_absolute() or '..' in p.parts or p.parts[0] in ('.git', 'drizzle') or any(s.startswith('.env') for s in p.parts):
                  raise SystemExit('Disallowed transfer path')
              f = root / p
              if any(x.is_symlink() for x in [f, *f.parents]) or not f.resolve().is_relative_to(root):
                  raise SystemExit('Symlink or outside-workspace path')
              before = f.read_bytes() if f.exists() else None
              actual = hashlib.sha256(before).hexdigest() if before is not None else None
              if actual != item['base']:
                  raise SystemExit('Base content changed: ' + str(p))
              if item['result'] is None:
                  after = None
              elif 'content' in item:
                  after = item['content'].encode('utf-8')
              else:
                  lines = before.decode('utf-8').splitlines(keepends=True)
                  for start, end, replacement in reversed(item['edits']):
                      lines[start:end] = [replacement]
                  after = ''.join(lines).encode('utf-8')
              actual = hashlib.sha256(after).hexdigest() if after is not None else None
              if actual != item['result']:
                  raise SystemExit('Result digest mismatch: ' + str(p))
              # Workflow edits use the authorized connector separately, never this job token.
              if str(p).startswith('.github/workflows/'):
                  continue
              pending.append((f, after))
          if len(pending) != 99:
              raise SystemExit('Unexpected source file count')
          for f, after in pending:
              if after is None:
                  f.unlink()
              else:
                  f.parent.mkdir(parents=True, exist_ok=True)
                  f.write_bytes(after)
              subprocess.run(['git', 'add', '-A', '--', str(f.relative_to(root))], check=True)
          subprocess.run(['git', 'rm', '-r', '--', '.beta-transfer'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          print('Applied and staged 99 verified source files; no production resources accessed.')
          PY
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Beta regression tests
        run: find e2e/beta -name '*.test.mjs' -print0 | sort -z | xargs -0 -r -n 1 node --import tsx
      - run: pnpm exec openspec validate internationalization --strict
      - name: Commit to the existing PR branch without force
        run: |
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(i18n): implement bilingual workspace, preferences and language policy'
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "Implementation commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
