name: Thread Chat Skills DTO Compatibility Patch

on:
  pull_request:
    paths:
      - ".github/workflows/thread-chat-skills-dto-compat.yml"
      - "app/thread-chat/gate-3-harness/mock-v1-runtime.ts"
      - "app/thread-chat/net/commands/conversation-commands.ts"
      - "lib/thread-chat/contracts/dto.ts"

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply explicit null and inherited Skill fields
        run: |
          python <<'PY'
          from pathlib import Path

          commands_path = Path("app/thread-chat/net/commands/conversation-commands.ts")
          commands = commands_path.read_text()
          command_replacements = [
              (
                  "    modelId: input.modelId ?? null,\n    replacesMessageId: input.replacesMessageId ?? null,\n",
                  "    modelId: input.modelId ?? null,\n    skill: null,\n    replacesMessageId: input.replacesMessageId ?? null,\n",
                  1,
              ),
              (
                  "      depth: 0,\n      modelId: command.modelId,\n      autoTitle: null,\n",
                  "      depth: 0,\n      modelId: command.modelId,\n      activeSkill: null,\n      autoTitle: null,\n",
                  1,
              ),
              (
                  "        depth: parent.depth + 1,\n        modelId: command.modelId,\n        autoTitle: null,\n",
                  "        depth: parent.depth + 1,\n        modelId: command.modelId,\n        activeSkill: parent.activeSkill,\n        autoTitle: null,\n",
                  1,
              ),
          ]
          for old, new, expected in command_replacements:
              count = commands.count(old)
              if count == 0 and new in commands:
                  continue
              if count != expected:
                  raise SystemExit(
                      f"conversation command replacement expected {expected}, found {count}: {old!r}"
                  )
              commands = commands.replace(old, new)
          commands_path.write_text(commands)

          mock_path = Path("app/thread-chat/gate-3-harness/mock-v1-runtime.ts")
          lines = mock_path.read_text().splitlines(keepends=True)
          output = []
          thread_insertions = 0
          message_insertions = 0
          for index, line in enumerate(lines):
              output.append(line)
              if "modelId:" not in line or index + 1 >= len(lines):
                  continue
              next_line = lines[index + 1]
              indentation = line[: len(line) - len(line.lstrip())]
              if next_line.lstrip().startswith("activeSkill:") or next_line.lstrip().startswith("skill:"):
                  continue
              if next_line.lstrip().startswith("autoTitle:"):
                  output.append(f"{indentation}activeSkill: null,\n")
                  thread_insertions += 1
              elif next_line.lstrip().startswith("replacesMessageId:"):
                  output.append(f"{indentation}skill: null,\n")
                  message_insertions += 1

          if thread_insertions not in (0, 4):
              raise SystemExit(
                  f"mock ThreadDTO insertion expected 4 or already patched, found {thread_insertions}"
              )
          if message_insertions not in (0, 10):
              raise SystemExit(
                  f"mock MessageDTO insertion expected 10 or already patched, found {message_insertions}"
              )
          mock_path.write_text("".join(output))
          PY
      - name: Commit compatibility patch when needed
        run: |
          git diff --check
          if git diff --quiet; then
            echo "DTO compatibility already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/thread-chat/gate-3-harness/mock-v1-runtime.ts app/thread-chat/net/commands/conversation-commands.ts
          git commit -m "feat(skills): carry Skill state in optimistic DTOs"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
