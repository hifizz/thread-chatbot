name: Thread Chat Skills Patch Runner

on:
  pull_request:
    paths:
      - ".github/workflows/thread-chat-skills-patch.yml"
      - ".github/thread-chat-skills.pending.patch"

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-pending-patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply and commit pending patch
        run: |
          patch_file=.github/thread-chat-skills.pending.patch
          if ! test -f "$patch_file"; then
            echo "No pending patch."
            exit 0
          fi
          git apply --check "$patch_file"
          git apply "$patch_file"
          rm "$patch_file"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(skills): apply pending implementation patch"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
