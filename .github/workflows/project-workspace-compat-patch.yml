name: Project Workspace Compatibility Patch

on:
  push:
    branches:
      - codex/research-project-workspace-design
    paths:
      - .github/workflows/project-workspace-compat-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/research-project-workspace-design

      - name: Patch legacy Gate 3 fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/thread-chat/gate-3-harness/mock-v1-runtime.ts')
          text = path.read_text()

          text = text.replace(
              '    customTitle: null,\n    archivedAt: null,',
              '    customTitle: null,\n    target: null,\n    instructions: null,\n    contractVersion: 0,\n    archivedAt: null,',
          )
          text = text.replace(
              '          customTitle: null,\n          archivedAt: null,',
              '          customTitle: null,\n          target: null,\n          instructions: null,\n          contractVersion: 0,\n          archivedAt: null,',
          )
          text = text.replace(
              '    projectId,\n    sourceMessageId: ROOT_ASSISTANT_ID,',
              '    projectId,\n    threadId: ROOT_THREAD_ID,\n    sourceMessageId: ROOT_ASSISTANT_ID,\n    sourceThreadTitle: "规范化会话验收",\n    sourceThreadFootnote: null,\n    sourceMessageStatus: "completed",',
          )
          text = text.replace(
              '        projectId,\n        sourceMessageId: messageId,',
              '        projectId,\n        threadId: current.threadId,\n        sourceMessageId: messageId,\n        sourceThreadTitle: threads.get(current.threadId)?.customTitle ?? threads.get(current.threadId)?.autoTitle ?? null,\n        sourceThreadFootnote: threads.get(current.threadId)?.footnote ?? null,\n        sourceMessageStatus: "completed",',
          )
          text = text.replace(
              '    project,\n    threads: [root, child, nested],',
              '    project,\n    files: [],\n    threads: [root, child, nested],',
          )
          text = text.replace(
              '    project: clone(project),\n    threads:',
              '    project: clone(project),\n    files: [],\n    threads:',
          )
          text = text.replace(
              '  const client = {',
              '  const client: ThreadChatClient = {',
          )
          text = text.replace(
              '  } as unknown as ThreadChatClient\n\n  const fetchStream',
              '  }\n\n  const fetchStream',
          )
          marker = '''    async setProjectArchived(_targetProjectId, input) {\n'''
          methods = '''    async updateProjectContract(_targetProjectId, input) {\n      if (!project) throw new Error("PROJECT_NOT_FOUND")\n      if (project.contractVersion !== input.expectedContractVersion)\n        throw new Error("PROJECT_CONTRACT_VERSION_CONFLICT")\n      project = {\n        ...project,\n        target: input.target.trim() || null,\n        instructions: input.instructions.trim() || null,\n        contractVersion: project.contractVersion + 1,\n        updatedAt: now(),\n      }\n      return commandResponse(clone(project))\n    },\n    async addProjectFile() {\n      throw new Error("PROJECT_FILE_UPLOAD_NOT_AVAILABLE_IN_GATE3_HARNESS")\n    },\n    async removeProjectFile(_targetProjectId, attachmentId) {\n      return commandResponse({\n        projectId,\n        attachmentId,\n        removed: true as const,\n      })\n    },\n'''
          if methods not in text and marker in text:
              text = text.replace(marker, methods + marker)

          path.write_text(text)
          PY

      - name: Commit fixture update
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/thread-chat/gate-3-harness/mock-v1-runtime.ts
          git commit -m "test(project): complete workspace client fixture [skip ci]"
          git push origin HEAD:codex/research-project-workspace-design
